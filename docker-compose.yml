version: '3.8'

# Docker Compose configuration for ThinkPad T420s Antigravity Thermal Agent
# Author: Dr. Bheemaiah Anil K, Director, Synergy Robotics Seattle
# License: MIT

services:
  thinkpad-thermal-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkpad-t420s-agent
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web Dashboard UI & Express API
      - "9090:9090"   # Hardware Bridge REST Daemon
    environment:
      - PORT=3000
      - BRIDGE_PORT=9090
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Optional: For real physical hardware ACPI & fan control on a Linux ThinkPad host:
    # privileged: true
    # volumes:
    #   - /proc/acpi/ibm:/proc/acpi/ibm:rw
    #   - /sys/devices/platform/thinkpad_hwmon:/sys/devices/platform/thinkpad_hwmon:ro
