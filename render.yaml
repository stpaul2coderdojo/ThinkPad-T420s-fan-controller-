services:
  # Option A: Native Node.js Web Service (Default)
  - type: web
    name: thinkpad-t420s-thermal-agent
    runtime: node
    plan: free
    region: oregon # alternatives: frankfurt, ohio, singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Option B: Docker Containerized Web Service
  # Uncomment below to deploy the Dockerfile directly on Render:
  # - type: web
  #   name: thinkpad-t420s-docker-agent
  #   runtime: docker
  #   plan: free
  #   region: oregon
  #   dockerfilePath: ./Dockerfile
  #   healthCheckPath: /healthz
  #   autoDeploy: true
  #   envVars:
  #     - key: NODE_ENV
  #       value: production

  # Option C: Static Site (100% Free CDN, client-side only)
  # Uncomment below for a serverless static deployment:
  # - type: web
  #   name: thinkpad-t420s-static-agent
  #   runtime: static
  #   plan: free
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html
